name: Prepare Android build tools
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/prepare-toolchain.yml
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install official Android build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "build-tools;35.0.0" "platforms;android-35"
          mkdir -p toolchain/build-tools toolchain/platforms
          cp -a "$ANDROID_HOME/build-tools/35.0.0" toolchain/build-tools/
          cp -a "$ANDROID_HOME/platforms/android-35" toolchain/platforms/
          tar -czf android-build-tools-35.tar.gz toolchain
      - name: Export tools for local signing and verification
        uses: actions/upload-artifact@v4
        with:
          name: android-build-tools-35
          path: android-build-tools-35.tar.gz
          retention-days: 3
          if-no-files-found: error
