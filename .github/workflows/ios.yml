name: Build Yexin Timetable IPA
on:
  workflow_dispatch:
  push:
    branches: [clearclass-ipa]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.3
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'
      - name: Prepare pinned font and spreadsheet engine
        run: |
          python3 Scripts/prepare-dependencies.py
          python3 -m venv build/font-tools
          build/font-tools/bin/pip install fonttools==4.61.1
          build/font-tools/bin/python Scripts/prepare-widget-font.py
      - name: Spreadsheet regression tests
        run: node Scripts/test-spreadsheet.cjs
      - name: Build and verify iPhone IPA including Widget
        run: |
          set -o pipefail
          mkdir -p build
          bash Scripts/build-unsigned.sh 2>&1 | tee build/device-build.log
      - name: Upload compiled IPA before simulator checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: YexinTimetable-unsigned-IPA
          path: |
            build/ClearClass-unsigned.ipa
            build/ClearClass-unsigned.verification.json
          if-no-files-found: ignore
      - name: Native XCTest and touch interaction tests on iOS simulator
        if: ${{ !contains(github.event.head_commit.message, '[layout-only]') }}
        timeout-minutes: 12
        run: |
          set -o pipefail
          RUNTIME_ID=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["identifier"] for x in d["runtimes"] if x.get("isAvailable") and "iOS-26" in x["identifier"]))')
          DEVICE_ID=$(xcrun simctl create "Yexin-$GITHUB_RUN_ID" com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro "$RUNTIME_ID")
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID"
          python3 -c 'import subprocess,sys; subprocess.run(["xcrun","simctl","bootstatus",sys.argv[1],"-b"],check=True,timeout=180)' "$DEVICE_ID"
          xcodebuild -project ClearClass.xcodeproj -scheme ClearClass -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath build/simulator -resultBundlePath build/TestResults.xcresult -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test 2>&1 | tee build/simulator-test.log
      - name: Export native screen and widget snapshots
        if: ${{ always() && env.DEVICE_ID != '' && !contains(github.event.head_commit.message, '[layout-only]') }}
        timeout-minutes: 3
        run: |
          mkdir -p build/Snapshots
          xcrun xcresulttool export attachments --path build/TestResults.xcresult --output-path build/Snapshots
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: YexinTimetable-build-evidence
          path: |
            build/*.log
            build/Snapshots/
          if-no-files-found: ignore
