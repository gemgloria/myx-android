name: Build Yexin Timetable IPA
on:
  workflow_dispatch:
  push:
    branches: [clearclass-ipa]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.3
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'
      - name: Prepare pinned font and spreadsheet engine
        run: python3 Scripts/prepare-dependencies.py
      - name: Spreadsheet regression tests
        run: node Scripts/test-spreadsheet.cjs
      - name: Build and verify iPhone IPA including Widget
        run: |
          set -o pipefail
          mkdir -p build
          bash Scripts/build-unsigned.sh 2>&1 | tee build/device-build.log
      - name: Native XCTest on iOS simulator
        run: |
          set -o pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for r,v in d["devices"].items() if "iOS-26" in r for x in v if "iPhone" in x["name"]))')
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcodebuild -project ClearClass.xcodeproj -scheme ClearClass -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath build/simulator -resultBundlePath build/TestResults.xcresult -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test 2>&1 | tee build/simulator-test.log
      - name: Capture native simulator screens
        run: |
          mkdir -p build/NativeScreens
          DEVICE_STATE=$(xcrun simctl list devices available -j | python3 -c 'import json,os,sys; d=json.load(sys.stdin); print(next(x["state"] for v in d["devices"].values() for x in v if x["udid"]==os.environ["DEVICE_ID"]))')
          if [ "$DEVICE_STATE" != "Booted" ]; then xcrun simctl boot "$DEVICE_ID"; fi
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" build/simulator/Build/Products/Debug-iphonesimulator/ClearClass.app
          xcrun simctl status_bar "$DEVICE_ID" override --time '9:41' --batteryState charged --batteryLevel 100
          for VIEW in week today settings detail; do
            xcrun simctl launch --terminate-running-process "$DEVICE_ID" com.mayexin.ClearClass --preview-demo "--preview-$VIEW"
            sleep 3
            xcrun simctl io "$DEVICE_ID" screenshot "build/NativeScreens/$VIEW.png"
          done
          xcrun simctl terminate "$DEVICE_ID" com.mayexin.ClearClass
      - name: Upload IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: YexinTimetable-unsigned-IPA
          path: |
            build/ClearClass-unsigned.ipa
            build/ClearClass-unsigned.verification.json
          if-no-files-found: ignore
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: YexinTimetable-build-evidence
          path: |
            build/*.log
            build/NativeScreens/*.png
          if-no-files-found: ignore
