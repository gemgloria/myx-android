ar(--line);border-radius:13px;background:var(--glass);padding:10px 11px;font-size:13px}.clockrow{display:flex;align-items:center;gap:8px;font-size:12px}.clockrow input{width:112px;font-size:11px}.primary{padding:13px 18px;display:block;width:100%;font-size:13px;font-weight:500;color:var(--accent);margin-top:15px}.toggle{appearance:none;width:37px;height:22px;border-radius:22px;background:#c7cbd5;position:relative;margin:0}.toggle:after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:white;left:2px;top:2px;transition:transform .2s}.toggle:checked{background:var(--accent)}.toggle:checked:after{transform:translateX(15px)}.widget-demo{display:flex;gap:14px}.mini-widget{width:150px;min-height:147px;padding:16px;position:relative}.mini-widget small{color:var(--muted);font-size:10px}.mini-widget h3{font-size:15px;line-height:1.6;font-weight:500;margin:10px 0}.mini-widget .widget-time{font-size:20px;color:var(--accent);font-weight:500}.sheet-shade{position:absolute;inset:0;background:rgba(34,37,63,.18);z-index:5;display:flex;align-items:flex-end;backdrop-filter:blur(4px)}.sheet{width:100%;max-height:92%;overflow-y:auto;background:radial-gradient(ellipse at 0% 0%,#e5e3f5,transparent 60%),var(--bg);border-radius:30px 30px 0 0;padding:20px 19px 33px;box-shadow:0 -15px 35px var(--shadow)}.sheet-head{display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:500;margin-bottom:20px}.sheet-head button{color:var(--accent);font-size:13px;min-height:36px}.sheet-handle{width:32px;height:4px;border-radius:2px;background:var(--muted);opacity:.35;margin:-8px auto 16px}.weekchoices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.weekchoice{font-size:12px;min-height:59px;border-radius:17px}.weekchoice.active{color:var(--accent)}.import-choice{padding:19px;display:block;width:100%;text-align:left;margin:12px 0;font-size:14px}.import-choice small{display:block;font-size:11px;color:var(--muted);margin-top:9px}.review-co .brand{font-size:25px}.term{padding:6px 9px;border-radius:13px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(20px)}.slot-count{font-size:8px;padding:1px 5px;align-self:flex-end;border-radius:8px}.detail-shade{position:absolute;inset:0;z-index:6;background:rgba(249,250,252,.57);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:flex;flex-direction:column;padding:20px;animation:enlarge .3s ease-out}.detail-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}.detail-cards{margin:auto 0;overflow:auto;max-height:calc(100% - 75px);padding:10px 0}.detail-card{padding:21px;margin:16px 0;color:var(--course);background:color-mix(in srgb,var(--course) 8%,var(--glass));border-radius:25px}.detail-card-head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}.detail-card h3{font-size:22px;margin:0;line-height:1.45;font-weight:500}.detail-card p{font-size:15px;margin:11px 0 0;line-height:1.7}.detail-edit{padding:8px 12px;color:inherit;font-size:13px;flex:none;border-radius:13px}.inactive{color:var(--muted);background:rgba(218,221,232,.28)}.inactive-badge{display:inline-block;font-size:10px;padding:3px 7px;margin-bottom:7px;border-radius:8px}.phone.dark .detail-shade{background:rgba(23,27,41,.55)}@keyframes enlarge{from{opacity:0;transform:scale(.93)}to{opacity:1;transform:scale(1)}}@media(prefers-reduced-motion:reduce){.detail-shade{animation:none}}

<main><aside class="description"><div class="eyebrow">CLEARCLASS / 烨昕的课表</div><h1>课表，轻一点。</h1><p>一周的安排，清晰地放在眼前。<br>半透明的玻璃表面，柔和的课程色彩。<br>保留常用功能，也留一点空白。</p><span class="tag">截图与表格导入</span><span class="tag">原生小组件</span><div class="preview-label">iOS 原生工程的交互式设计预览<br>原生编译与实机效果仍需在 Xcode 验证</div><button class="theme-control" id="theme-button">切换深色预览</button></aside>
<section class="phone" id="phone" aria-label="烨昕的课表手机界面预览"><div class="shell"><div class="status"><span>9:41</span><div class="island"></div><span class="status-right">▮▮▮ 5G ▰</span></div><div class="viewport" id="viewport"></div><nav class="bottom glass" aria-label="主要功能"><button class="tab active" data-tab="week"><span class="symbol">▦</span>课表</button><button class="tab" data-tab="today"><span class="symbol">☼</span>今天</button><button class="tab" data-tab="settings"><span class="symbol">☷</span>设置</button></nav><div class="home-indicator"></div><div id="overlay"></div></div></section></main>

<script>
const weekdays=['一','二','三','四','五','六','日'];const periodTimes=[['08:00','08:45'],['08:50','09:35'],['09:55','10:40'],['10:45','11:30'],['14:00','14:45'],['14:50','15:35'],['15:45','16:30'],['16:35','17:20'],['18:30','19:15'],['19:20','20:05'],['20:10','20:55'],['21:00','21:45']];
const range=(a,b)=>Array.from({length:b-a+1},(_,i)=>a+i);
const make=(name,day,start,end,weeks,room,color,teacher='')=>({name,weekday:day,startPeriod:start,endPeriod:end,weeks,location:room,color,teacher});
let semesters=[{name:'2026–2027 第1学期',firstMonday:'2026-08-31',courses:[
make('概率论与数理统计 C',1,1,2,range(1,16),'教三南102','violet','许武玲'),make('综合能源系统与技术',2,1,2,range(1,8),'教三北413','teal','胡静、李凡、刘慧、陈志杰'),make('大数据技术及能源大数据',3,1,2,[1,2,3,4,6,7,8],'教三北413','blue','邹雪'),make('太阳能利用概论',4,1,2,range(1,10),'教三北413','amber','李海金、王健敏、汪波'),make('新能源专业英语',4,1,2,range(11,18),'教三北413','indigo','毛可可'),make('传热学',5,1,2,range(1,14),'教三北112','rose','汪冬冬'),make('高等数学 A1',6,1,4,range(4,18),'东教一北105','violet','李小伟'),make('电工学 2',7,1,4,range(4,11),'东教D207','teal','连马俊'),make('大数据技术及能源大数据',1,3,4,range(1,8),'教三北413','blue','邹雪'),make('太阳能利用概论',2,3,4,range(1,10),'教三北413','amber','李海金、王健敏、汪波'),make('新能源专业英语',2,3,4,range(11,18),'教三北413','indigo','毛可可'),make('传热学',3,3,4,range(1,14),'教三北112','rose','汪冬冬'),make('大数据技术及能源大数据',3,3,4,[6],'教一107','blue','邹雪'),make('综合能源系统与技术',4,3,4,range(1,8),'教三北413','teal','胡静、李凡、刘慧、陈志杰'),make('物理实验',2,5,6,range(1,18),'教二4、5楼物理实验室','rose','孙云'),make('新能源材料基础',3,9,11,[1,2,3,4,...range(6,14)],'教三北413','indigo','胡静、何一涛'),make('大学生职业发展与就业指导7',4,9,11,[1,2],'教三南203','amber','王稳定、贾丽'),make('电工学实验2（分组07）',5,9,12,[3,7,9,11,14,16],'教一701','teal','彭顺风')]}];
let selected=0,week=6,tab=(new URLSearchParams(location.search).get('tab')||'week'),imported=null;const nowDate='2026-10-10';const viewport=document.getElementById('viewport'),overlay=document.getElementById('overlay');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const term=()=>semesters[selected];const monday=()=>{let d=new Date(term().firstMonday+'T12:00:00');d.setDate(d.getDate()+(week-1)*7);return d;};
function header(){return `<div class="header"><div><h2 class="brand">烨昕的课表</h2><select class="term" id="term-select" aria-label="选择学期">${semesters.map((s,i)=>`<option value="${i}" ${i===selected?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div><div class="header-actions"><button class="icon-button glass" id="import-open" aria-label="导入课表">↓</button><button class="icon-button glass" id="add-open" aria-label="添加课程">＋</button></div></div>`;}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='week')renderWeek();if(tab==='today')renderToday();if(tab==='settings')renderSettings();}
function renderWeek(){let mon=monday();let dateText=`${mon.getMonth()+1}月${mon.getDate()}日 – `;let sun=new Date(mon);sun.setDate(sun.getDate()+6);dateText+=`${sun.getMonth()+1}月${sun.getDate()}日`;
viewport.innerHTML=header()+`<div class="weekbar glass"><button id="prev-week" ${week===1?'disabled':''} aria-label="上一周">‹</button><button class="week-title" id="week-open">第 ${week} 周 ⌄</button><span class="dates">${dateText}</span><button class="backweek" id="current-week">本周</button><button id="next-week" ${week===20?'disabled':''} aria-label="下一周">›</button></div><div class="days"><div class="month">${mon.getMonth()+1}月</div>${weekdays.map((w,i)=>{let d=new Date(mon);d.setDate(d.getDate()+i);const key=d.toLocaleDateString('sv-SE');return `<div class="day ${key===nowDate?'today':''}">${w}<b>${d.getDate()}</b></div>`;}).join('')}</div><div class="grid" id="grid">${periodTimes.map((p,i)=>`<div class="row"><div class="period"><b>${i+1}</b><span>${p[0]}</span><span>${p[1]}</span></div><div class="rule"></div></div>`).join('')}</div>`;
const grid=document.getElementById('grid'),width=grid.getBoundingClientRect().width,cell=(width-39-24)/7;
for(let day=1;day<=7;day++){const courses=term().courses.filter(c=>c.weekday===day&&c.weeks.includes(week)).sort((a,b)=>a.startPeriod-b.startPeriod||b.endPeriod-a.endPeriod||a.name.localeCompare(b.name));let groups=[],group=[],end=0;for(const c of courses){if(group.length&&c.startPeriod>end){groups.push(group);group=[];end=0;}group.push(c);end=Math.max(end,c.endPeriod);}if(group.length)groups.push(group);for(const g of groups){const c=g[0],start=Math.min(...g.map(x=>x.startPeriod)),end=Math.max(...g.map(x=>x.endPeriod));const alternatives=term().courses.filter(x=>x.weekday===day&&x.startPeriod<=end&&x.endPeriod>=start);let button=document.createElement('button');button.className='course glass';button.style=`--course:var(--${c.color});left:${39+(day-1)*(cell+4)}px;top:${(start-1)*84+3}px;width:${cell}px;height:${(end-start+1)*84-7}px`;button.setAttribute('aria-label',c.name+' '+c.location);button.innerHTML=`${alternatives.length>1?'<span class="slot-count glass">'+alternatives.length+'</span>':''}<strong>${esc(c.name)}</strong><span class="room">${esc(c.location)}</span>${g.length>1?'<span class="flag">本周重叠</span>':''}`;button.onclick=()=>showDetail(c);grid.appendChild(button);}}}
function renderToday(){const courses=term().courses.filter(c=>c.weekday===6&&c.weeks.includes(week));const next=courses[0];viewport.innerHTML=`<h2 class="page-title">今天</h2><div class="subtitle">10月10日 星期六 · 第 ${week} 周</div>${next?`<button class="section glass" style="text-align:left;width:100%" id="today-detail"><div class="section-label">正在上课 ↗</div><div class="big-course">${esc(next.name)}</div><div class="row-info">今天 · ${periodTimes[next.startPeriod-1][0]} – ${periodTimes[next.endPeriod-1][1]}</div><div class="pin">⌖ ${esc(next.location)}</div></button>`:''}<div class="small-heading">今日安排</div>${courses.map(c=>`<div class="section glass agenda"><div class="agenda-time"><b>${periodTimes[c.startPeriod-1][0]}</b>${periodTimes[c.endPeriod-1][1]}</div><div class="agenda-bar"></div><div class="agenda-text">${esc(c.name)}<small>${esc(c.location)}</small></div></div>`).join('')||'<div class="empty">今天没有课，留一点时间给自己。</div>'}`;if(next)document.getElementById('today-detail').onclick=()=>showDetail(next);}
function renderSettings(){const next=term().courses.find(c=>c.weekday===6&&c.weeks.includes(week));viewport.innerHTML=`<h2 class="page-title">设置</h2><div style="height:20px"></div><div class="section glass"><div class="section-label">学期</div><label class="settings-row">当前学期<select class="field" style="max-width:182px" id="term-select" aria-label="选择学期">${semesters.map((s,i)=>`<option value="${i}" ${i===selected?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label><label class="settings-row">第1周的周一<input class="field" style="max-width:151px" type="date" id="start-date" value="${term().firstMonday}"></label></div><div class="section glass"><div class="section-label">上课时间</div>${periodTimes.slice(0,4).map((p,i)=>`<div class="clockrow"><span>第${i+1}节</span><input class="field" aria-label="第${i+1}节开始" type="time" data-time="${i},0" value="${p[0]}"><span>–</span><input class="field" aria-label="第${i+1}节结束" type="time" data-time="${i},1" value="${p[1]}"></div>`).join('')}<div class="notice">预览展示前四节，原生版可编辑全部节次。</div></div><div class="section glass"><div class="section-label">显示</div><label class="settings-row">深色模式<input class="toggle" type="checkbox" id="dark-toggle" ${document.getElementById('phone').classList.contains('dark')?'checked':''}></label></div><div class="section glass"><div class="section-label">导入课表</div><button class="settings-row" id="import-open">截图或表格 <small>›</small></button></div><div class="section glass"><div class="section-label">桌面小组件</div><div class="small-heading">小组件设计预览</div><div class="widget-demo"><div class="mini-widget glass"><small>烨昕的课表 · 第${week}周</small><h3>${esc(next?.name||'今天没有课')}</h3><div class="widget-time">${next?periodTimes[next.startPeriod-1][0]:'休息日'}</div><small>${esc(next?.location||'')}</small></div></div><div class="row-info">长按桌面 → 添加小组件 → 烨昕的课表</div></div>`;}
function sheet(title,content,action=''){overlay.innerHTML=`<div class="sheet-shade"><section class="sheet"><div class="sheet-handle"></div><div class="sheet-head"><button id="sheet-close">取消</button><span>${esc(title)}</span>${action||'<span style="width:28px"></span>'}</div>${content}</section></div>`;document.getElementById('sheet-close').onclick=()=>overlay.innerHTML='';}
function showWeeks(){sheet('选择周次',`<div class="weekchoices">${range(1,20).map(w=>`<button class="weekchoice glass ${w===week?'active':''}" data-week="${w}">第 ${w} 周</button>`).join('')}</div>`);}
function showDetail(c){const alternatives=term().courses.filter(x=>x.weekday===c.weekday&&x.startPeriod<=c.endPeriod&&x.endPeriod>=c.startPeriod).sort((a,b)=>Number(b.weeks.includes(week))-Number(a.weeks.includes(week))||a.weeks[0]-b.weeks[0]);overlay.innerHTML=`<div class="detail-shade"><div class="detail-head"><span>第 ${week} 周 · 同一时段</span><button id="detail-close" class="icon-button glass" aria-label="关闭课程详情">×</button></div><div class="detail-cards">${alternatives.map((x,i)=>`<article class="detail-card glass ${x.weeks.includes(week)?'':'inactive'}" style="--course:var(--${x.color})"><div class="detail-card-head"><div>${x.weeks.includes(week)?'':'<span class="inactive-badge glass">非本周</span>'}<h3>${esc(x.name)}</h3></div><button class="glass detail-edit" data-edit="${i}">编辑</button></div><p>第 ${formatWeeks(x.weeks)} 周</p><p>周${weekdays[x.weekday-1]} | 第${x.startPeriod}–${x.endPeriod}节 | ${periodTimes[x.startPeriod-1][0]}–${periodTimes[x.endPeriod-1][1]}</p><p>教室：${esc(x.location||'待补充')}</p><p>老师：${esc(x.teacher||'待补充')}</p></article>`).join('')}</div></div>`;document.getElementById('detail-close').onclick=()=>overlay.innerHTML='';overlay.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>showEditor(alternatives[+b.dataset.edit]));}
function formatWeeks(weeks){let parts=[],start=weeks[0],end=start;for(const w of [...weeks.slice(1),null]){if(w===end+1){end=w;continue;}parts.push(start===end?String(start):start+'–'+end);start=end=w;}return parts.join(',');}
function showEditor(existing){sheet(existing?'编辑课程':'添加课程',`<label class="row-info">课程名称<input id="course-name" class="field" value="${esc(existing?.name||'')}"></label><label class="row-info">教室<input id="course-room" class="field" value="${esc(existing?.location||'')}"></label><label class="row-info">星期<select class="field" id="course-day">${weekdays.map((w,i)=>`<option value="${i+1}" ${existing?.weekday===i+1?'selected':''}>周${w}</option>`).join('')}</select></label><label class="row-info">节次<input class="field" id="course-periods" value="${existing?existing.startPeriod+'-'+existing.endPeriod:'1-2'}"></label><label class="row-info">周次<input class="field" id="course-weeks" value="${existing?existing.weeks.join(','):'1-18'}"></label><div id="edit-error" class="notice" role="alert"></div>`, '<button id="course-save">保存</button>');document.getElementById('course-save').onclick=()=>{try{let name=document.getElementById('course-name').value.trim();if(!name)throw Error('请填写课程名称');let p=ClearClassSpreadsheet.parsePeriods(document.getElementById('course-periods').value);let w=ClearClassSpreadsheet.parseWeeks(document.getElementById('course-weeks').value);if(p.length!==1)throw Error('预览编辑器仅支持一个连续节次段');let c=make(name,+document.getElementById('course-day').value,p[0][0],p[0][1],w,document.getElementById('course-room').value,'indigo',existing?.teacher||'');if(existing)Object.assign(existing,c);else term().courses.push(c);overlay.innerHTML='';render();}catch(e){document.getElementById('edit-error').textContent=e.message;}};}
function showImport(){sheet('导入课表',`<h3 style="font-size:20px;font-weight:500">把教务课表带进来</h3><div class="notice">截图在 iOS 原生版中使用 Vision 识别。此设计预览可实际读取表格。</div><button class="import-choice glass" id="photo-explain">课表截图<small>本机文字识别 · 原生版可用</small></button><button class="import-choice glass" id="spreadsheet-select">课表表格<small>XLS、XLSX、CSV、TSV</small></button><input type="file" id="file-input" accept=".xls,.xlsx,.csv,.tsv" hidden><div id="import-error" class="notice" role="alert"></div>`);document.getElementById('photo-explain').onclick=()=>document.getElementById('import-error').textContent='截图识别请在原生 iOS 应用中使用。';document.getElementById('spreadsheet-select').onclick=()=>document.getElementById('file-input').click();document.getElementById('file-input').onchange=async e=>{try{const file=e.target.files[0];if(!file)return;if(file.size>10*1024*1024)throw Error('文件超过10 MB');const data=new Uint8Array(await file.arrayBuffer());let binary='';for(let i=0;i<data.length;i++)binary+=String.fromCharCode(data[i]);imported=JSON.parse(ClearClassSpreadsheet.importWorkbook(btoa(binary)));showReview();}catch(error){document.getElementById('import-error').textContent=error.message;}};}
function showReview(){sheet('核对课程',`<h3 style="font-weight:500">读到 ${imported.courses.length} 门课程</h3><div class="section glass"><div class="section-label">新建学期</div><input class="field" id="import-name" value="${esc(imported.suggestedSemesterName||'导入学期')}"><label class="row-info">第1周的周一<input type="date" class="field" id="import-start" value="2025-09-01"></label></div><div class="notice">已去除 ${imported.duplicateCount} 条重复记录。${esc(imported.warnings.join(' '))}</div>${imported.courses.map((c,i)=>`<label class="review-course glass"><input type="checkbox" data-include="${i}" checked><span>${esc(c.name)}<small>周${weekdays[c.weekday-1]} · 第${c.startPeriod}–${c.endPeriod}节 · ${esc(c.location||'教室待补充')}<br>第${esc(c.weeks.join(','))}周</small></span></label>`).join('')}`,'<button id="import-save">导入</button>');document.getElementById('import-save').onclick=()=>{const courses=[...overlay.querySelectorAll('[data-include]:checked')].map(el=>imported.courses[+el.dataset.include]);if(!courses.length)return;let d=new Date(document.getElementById('import-start').value+'T12:00:00');if(Number.isNaN(d.getTime()))return;d.setDate(d.getDate()-((d.getDay()+6)%7));semesters.push({name:document.getElementById('import-name').value,firstMonday:d.toLocaleDateString('sv-SE'),courses});selected=semesters.length-1;week=6;tab='week';overlay.innerHTML='';render();};}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;viewport.scrollTop=0;render();}if(b.id==='import-open')showImport();if(b.id==='add-open')showEditor();if(b.id==='week-open')showWeeks();if(b.id==='prev-week'){week=Math.max(1,week-1);render();}if(b.id==='next-week'){week=Math.min(20,week+1);render();}if(b.id==='current-week'){week=6;render();}if(b.dataset.week){week=+b.dataset.week;overlay.innerHTML='';render();}if(b.id==='theme-button'){document.getElementById('phone').classList.toggle('dark');b.textContent=document.getElementById('phone').classList.contains('dark')?'切换浅色预览':'切换深色预览';}});
document.addEventListener('change',e=>{if(e.target.id==='term-select'){selected=+e.target.value;render();}if(e.target.id==='start-date'){let d=new Date(e.target.value+'T12:00:00');if(Number.isNaN(d.getTime()))return;d.setDate(d.getDate()-((d.getDay()+6)%7));term().firstMonday=d.toLocaleDateString('sv-SE');render();}if(e.target.id==='dark-toggle'){document.getElementById('phone').classList.toggle('dark',e.target.checked);}if(e.target.dataset.time){let [i,j]=e.target.dataset.time.split(',').map(Number);periodTimes[i][j]=e.target.value;}});
render();
</script></body></html>
